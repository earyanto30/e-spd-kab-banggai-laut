name: Build & Deploy

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.4.2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests
        run: npx vitest run --coverage

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ github.sha }}
            type=sha,format=short

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Prune old images from GHCR
        uses: dataaxiom/ghcr-cleanup-action@v1
        continue-on-error: true
        with:
          keep-n-tagged: 1
          delete-untagged: true

      - name: Trigger ShipFlare Deploy
        env:
          SHIPFLARE_SECRET: ${{ secrets.SHIPFLARE_SECRET }}
        run: |
          TS=$(date +%s)
          BODY="{\"tag\":\"${GITHUB_SHA}\"}"
          SIG=$(printf '%s.%s' "$TS" "$BODY" | openssl dgst -sha256 -hmac "$SHIPFLARE_SECRET" | awk '{print $2}')
          curl -fsS -X POST "https://cd.aryanto.site/api/v1/webhooks/deploy?app=dev-espd-banggai-laut-aryanto-site" \
            -H "X-ShipFlare-Timestamp: $TS" \
            -H "X-ShipFlare-Signature: sha256=$SIG" \
            -H "Content-Type: application/json" \
            -d "$BODY"
