version = 1

# Tell DeepSource which files are tests
test_patterns = [
  "**/*.test.js",
  "**/*.test.ts",
  "**/*.test.jsx",
  "**/*.test.tsx",
  "**/*.spec.ts",
  "**/*.spec.js",
  "tests/**"
]

# Files/folders to skip during analysis
exclude_patterns = [
  "node_modules/**",
  "dist/**",
  "build/**",
  ".next/**",
  "coverage/**"
]

# Core JavaScript / TypeScript Analyzer
[[analyzers]]
name = "javascript"
enabled = true

  [analyzers.meta]
  environment = ["nodejs", "browser"]
  js_version = "es2022"
